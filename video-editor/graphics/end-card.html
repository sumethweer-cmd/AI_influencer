<!doctype html>
<html
  lang="th"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"series","type":"string","label":"Series title","default":"น้ำลดแล้ว…เธอจะไปไหม?"},
    {"id":"nextEp","type":"string","label":"Next episode line","default":"ตอนต่อไป EP.02 เร็วๆ นี้"},
    {"id":"headline","type":"string","label":"Headline","default":"ชอบตอนนี้ไหม?"},
    {"id":"cover","type":"string","label":"Cover image","default":"assets/cover.png"},
    {"id":"accent","type":"color","label":"Accent","default":"#FFC933"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "LeelaUI";
        src: url("fonts/LeelaUIb.ttf");
        font-weight: 700;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #060d17; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #060d17;
              font-family: "LeelaUI", Tahoma, sans-serif; font-weight: 700; color: #f3f6fa; }
      #cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 40%; }
      #shade { position: absolute; inset: 0;
               background: linear-gradient(to bottom, rgba(6,13,23,0.55) 0%, rgba(6,13,23,0) 22%, rgba(6,13,23,0) 38%, rgba(6,13,23,0.88) 72%, rgba(6,13,23,0.96) 100%); }
      #top { position: absolute; top: 130px; left: 0; right: 0; text-align: center; font-size: 46px;
             text-shadow: 0 3px 14px rgba(0,0,0,0.8); }
      #bottom { position: absolute; left: 0; right: 0; bottom: 170px; display: flex; flex-direction: column;
                align-items: center; gap: 34px; }
      #headline { font-size: 100px; line-height: 1.3; text-shadow: 0 4px 18px rgba(0,0,0,0.7); }
      #actions { display: flex; gap: 28px; }
      .pill { display: flex; align-items: center; gap: 18px; padding: 20px 46px; border-radius: 60px;
              font-size: 56px; line-height: 1.3; }
      #like { background: var(--accent); color: #0a1626; }
      #follow { background: rgba(243,246,250,0.14); border: 3px solid rgba(243,246,250,0.7); }
      .pill svg { width: 56px; height: 56px; }
      #next { font-size: 46px; color: rgba(243,246,250,0.86); }
      #next b { color: var(--accent); font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="end-card" data-start="0" data-duration="3.6" data-width="1080" data-height="1920" data-fps="24">
      <img id="cover" class="clip" data-start="0" data-duration="3.6" data-track-index="0" data-var-src="cover" src="assets/cover.png" />
      <div id="shade" class="clip" data-start="0" data-duration="3.6" data-track-index="1"></div>
      <div id="top" class="clip" data-start="0" data-duration="3.6" data-track-index="2" data-var-text="series">น้ำลดแล้ว…เธอจะไปไหม?</div>
      <div id="bottom" class="clip" data-start="0" data-duration="3.6" data-track-index="3">
        <div id="headline" data-var-text="headline">ชอบตอนนี้ไหม?</div>
        <div id="actions">
          <div id="like" class="pill">
            <svg viewBox="0 0 24 24" fill="#0a1626"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.6 5 6 5c2 0 3.3 1.1 4 2.2h4C14.7 6.1 16 5 18 5c3.400 0 5.100 3.400 3.600 6.800C19.500 16.400 12 21 12 21z"/></svg>
            <span>กดไลก์</span>
          </div>
          <div id="follow" class="pill">
            <svg viewBox="0 0 24 24" fill="none" stroke="#f3f6fa" stroke-width="3" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
            <span>กดติดตาม</span>
          </div>
        </div>
        <div id="next" data-var-text="nextEp">ตอนต่อไป EP.02 เร็วๆ นี้</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cover", { scale: 1.0 }, { scale: 1.07, duration: 3.6, ease: "none" }, 0);
      tl.fromTo("#top", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.2);
      tl.fromTo("#headline", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.35);
      tl.fromTo("#like", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.6);
      tl.fromTo("#follow", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.72);
      tl.fromTo("#next", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.95);
      tl.fromTo("#like", { scale: 1 }, { scale: 1.07, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.5);
      window.__timelines["end-card"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
